<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professional teaching binder and portfolio of Ramelito Jr. C. Sanchez, LPT (Jonmiru), Science Educator in the STE Program under the Philippine MATATAG curriculum." />
  <meta name="keywords" content="Ramelito Sanchez, LPT, STE Science, MATATAG Curriculum, DepEd Portfolio, Teacher Portfolio, Science Educator" />
  <meta name="author" content="Ramelito Jr. C. Sanchez, LPT" />
  <meta name="color-scheme" content="dark light" />
  
  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ramelito Jr. C. Sanchez, LPT · Science Educator & STE Faculty Portfolio" />
  <meta property="og:description" content="Tabbed professional teaching portfolio with verified evidence sleeves, lesson exemplars, and RPMS-PPST performance matrices." />
  <meta property="og:image" content="assets/images/cover-hero.svg" />
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ramelito Jr. C. Sanchez, LPT · Science Educator Portfolio" />
  <meta name="twitter:description" content="Physical tabbed binder web portfolio for secondary science education and research advising." />
  <meta name="twitter:image" content="assets/images/cover-hero.svg" />

  <title>Ramelito Jr. C. Sanchez, LPT · Science Educator &amp; STE Faculty Portfolio</title>
  
  <link rel="icon" type="image/svg+xml" href="assets/images/profile-portrait.svg" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/binder.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Ramelito Jr. C. Sanchez",
    "alternateName": "Jonmiru",
    "jobTitle": "Special Science Teacher (STE Program)",
    "description": "Secondary Science Educator and STEM research adviser in the Philippine Department of Education.",
    "email": "mailto:sanchez.ramelito@deped.gov.ph",
    "url": "https://jonmiru.github.io/portfolio-binder",
    "alumniOf": "State University",
    "hasCredential": [
      {
        "@type": "EducationalOccupationalCredential",
        "name": "Licensed Professional Teacher (LPT)",
        "credentialCategory": "Professional License",
        "recognizedBy": {
          "@type": "Organization",
          "name": "Professional Regulation Commission"
        }
      }
    ]
  }
  </script>
</head>
<body>
  <!-- Accessible Skip Link -->
  <a href="#binder-page-content" class="skip-link">Skip to binder contents</a>

  <!-- Top Bar / Perspective & Theme Controls -->
  <header class="top-bar no-print" role="banner">
    <div class="top-bar-branding">
      <span class="binder-logo" id="site-branding-title">Ramelito Jr. C. Sanchez</span>
      <span class="chip chip-accent text-mono" style="font-size: 0.7rem;">STE Faculty · LPT</span>
    </div>

    <div class="top-bar-controls">
      <div class="preset-selector">
        <label for="audience-preset-select" class="visually-hidden">Audience Preset</label>
        <span style="font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase;">View:</span>
        <select id="audience-preset-select" class="preset-select" title="Switch audience perspective view"></select>
      </div>

      <button id="btn-toggle-theme" class="theme-toggle-btn" aria-label="Toggle dark and paper theme">
        ☀️ Paper
      </button>
    </div>
  </header>

  <!-- Binder Physical Metaphor Wrapper -->
  <main class="binder-wrapper" role="main">
    <div class="binder-container">
      
      <!-- Binder Spine / Punch Hole Rings (Desktop Left Edge) -->
      <aside class="binder-spine no-print" aria-hidden="true">
        <div class="binder-ring"></div>
        <div class="binder-ring"></div>
        <div class="binder-ring"></div>
      </aside>

      <!-- Binder Page Content Surface -->
      <section class="binder-page" id="binder-page-container">
        <div id="binder-page-content" tabindex="-1">
          <!-- Dynamically Rendered Page Content -->
        </div>
      </section>

      <!-- Binder Divider Tabs (Desktop Right Edge / Mobile Top Bar) -->
      <nav class="binder-tabs no-print" id="binder-tabs-nav" role="tablist" aria-label="Binder divider tabs">
        <!-- Dynamically Populated Tabs -->
      </nav>

    </div>
  </main>

  <!-- Binder Footer -->
  <footer class="site-footer" role="contentinfo">
    <div>
      <span id="footer-copy-text">Ramelito Jr. C. Sanchez, LPT (Jonmiru) · DepEd Science Educator · STE Program</span>
    </div>

    <div class="footer-keys no-print">
      <kbd>←</kbd> <kbd>→</kbd> Flip Tabs · <kbd>Home</kbd> <kbd>End</kbd> First/Last · <kbd>Esc</kbd> Close
      <span style="margin: 0 0.5rem; opacity: 0.4;">|</span>
      <a href="#/admin" class="text-muted" style="text-decoration: underline;" title="Owner Administration">Owner Access</a>
    </div>
  </footer>

  <!-- Modular App Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
