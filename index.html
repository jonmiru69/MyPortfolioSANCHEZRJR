<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professional portfolio of Ramelito Jr. C. Sanchez, educator at Colegio de Sto. Tomas - Recoletos, Incorporated." />
  <meta name="keywords" content="Ramelito Sanchez, science educator, teaching portfolio" />
  <meta name="author" content="Ramelito Jr. C. Sanchez, LPT" />
  <meta name="color-scheme" content="dark light" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ramelito Jr. C. Sanchez, LPT · Science Educator Portfolio" />
  <meta property="og:description" content="Tabbed professional teaching portfolio with verified evidence sleeves, lesson exemplars, and RPMS-PPST performance matrices." />
  <meta property="og:image" content="assets/images/cover-hero.svg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ramelito Jr. C. Sanchez, LPT · Science Educator Portfolio" />
  <meta name="twitter:description" content="Physical tabbed binder web portfolio for secondary science education and research advising." />
  <meta name="twitter:image" content="assets/images/cover-hero.svg" />

  <title>Ramelito Jr. C. Sanchez, LPT · Science Educator Portfolio</title>

  <link rel="icon" type="image/svg+xml" href="assets/images/profile-portrait.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/binder.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/redesign.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />


</head>
<body>
  <!-- Accessible Skip Link -->
  <a href="#binder-page-content" class="skip-link">Skip to content</a>

  <!-- Top Bar / Perspective & Theme Controls -->
  <header class="top-bar no-print" role="banner">
    <div class="top-bar-controls">
      <button id="btn-toggle-theme" class="theme-toggle-btn" aria-label="Toggle dark and paper theme">
        Light mode
      </button>
    </div>
  </header>

  <!-- Binder Physical Metaphor Wrapper -->
  <main class="binder-wrapper" role="main">
    <div class="binder-container">

      <!-- Binder Spine / Punch Hole Rings (Desktop Left Edge) -->
      <aside class="binder-spine no-print" aria-hidden="true">
        <div class="binder-ring"></div>
        <div class="binder-ring"></div>
        <div class="binder-ring"></div>
      </aside>

      <!-- Binder Page Content Surface -->
      <section class="binder-page" id="binder-page-container">
        <div id="binder-page-content" tabindex="-1">
          <!-- Dynamically Rendered Page Content -->
        </div>
      </section>

      <!-- Binder Divider Tabs (Desktop Right Edge / Mobile Top Bar) -->
      <button class="section-menu-toggle no-print" id="section-menu-toggle" type="button" aria-expanded="false" aria-controls="binder-tabs-nav">Browse sections</button>
      <nav class="binder-tabs no-print" id="binder-tabs-nav" aria-label="Portfolio sections">
        <!-- Dynamically Populated Tabs -->
      </nav>

    </div>
  </main>

  <!-- Binder Footer -->
  <footer class="site-footer" role="contentinfo">
    <div>
      <span id="footer-copy-text">Ramelito Jr. C. Sanchez · Colegio de Sto. Tomas - Recoletos, Incorporated</span>
    </div>

    <div class="footer-keys no-print">

      <a href="#/admin" class="text-muted" style="text-decoration: underline;" title="Owner Administration">Owner Access</a>
    </div>
  </footer>

  <!-- Modular App Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
