<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
  </defs>
  <!-- Certificate Border -->
  <rect width="800" height="560" fill="url(#certBg)"/>
  <rect x="25" y="25" width="750" height="510" fill="none" stroke="#1e5a6b" stroke-width="4"/>
  <rect x="35" y="35" width="730" height="490" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="8,4"/>
  
  <!-- Header -->
  <text x="400" y="90" font-family="'Space Grotesk', serif" font-size="14" font-weight="700" letter-spacing="0.3em" fill="#555" text-anchor="middle">REPUBLIC OF THE PHILIPPINES · DEPARTMENT OF EDUCATION</text>
  <text x="400" y="120" font-family="'Space Grotesk', serif" font-size="12" letter-spacing="0.2em" fill="#777" text-anchor="middle">SCHOOLS DIVISION OFFICE · SPECIAL SCIENCE PROGRAM</text>
  
  <text x="400" y="185" font-family="'Space Grotesk', serif" font-size="32" font-weight="700" letter-spacing="0.1em" fill="#1e5a6b" text-anchor="middle">CERTIFICATE OF RECOGNITION</text>
  <text x="400" y="215" font-family="'Inter', sans-serif" font-size="13" fill="#666" text-anchor="middle">THIS IS PROUDLY PRESENTED TO</text>
  
  <!-- Recipient -->
  <text x="400" y="275" font-family="'Space Grotesk', serif" font-size="34" font-weight="700" fill="#111" text-anchor="middle">Ramelito Jr. C. Sanchez, LPT</text>
  <line x1="200" y1="290" x2="600" y2="290" stroke="#1e5a6b" stroke-width="1.5"/>
  
  <!-- Body -->
  <text x="400" y="330" font-family="'Inter', sans-serif" font-size="14" fill="#333" text-anchor="middle">for exemplary demonstration teaching and sustained coaching excellence</text>
  <text x="400" y="355" font-family="'Inter', sans-serif" font-size="14" fill="#333" text-anchor="middle">in the Special Science Program (STE) and MATATAG Curriculum implementation.</text>
  
  <!-- Signatures -->
  <line x1="140" y1="460" x2="330" y2="460" stroke="#888" stroke-width="1"/>
  <text x="235" y="480" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#333" text-anchor="middle">EDUCATION PROGRAM SUPERVISOR</text>
  <text x="235" y="495" font-family="'Inter', sans-serif" font-size="10" fill="#777" text-anchor="middle">Science &amp; Technology</text>

  <!-- Gold Seal -->
  <circle cx="400" cy="455" r="38" fill="#d4af37" opacity="0.9"/>
  <circle cx="400" cy="455" r="32" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="400" y="460" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">OFFICIAL</text>
  <text x="400" y="470" font-family="'Inter', sans-serif" font-size="8" fill="#fff" text-anchor="middle">SEAL</text>

  <line x1="470" y1="460" x2="660" y2="460" stroke="#888" stroke-width="1"/>
  <text x="565" y="480" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#333" text-anchor="middle">SCHOOLS DIVISION SUPERINTENDENT</text>
  <text x="565" y="495" font-family="'Inter', sans-serif" font-size="10" fill="#777" text-anchor="middle">Department of Education</text>
</svg>
