<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0d" />
      <stop offset="50%" stop-color="#12161b" />
      <stop offset="100%" stop-color="#182229" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b8296" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Geometric Abstract Scientific Lattice -->
  <g opacity="0.25" stroke="#3b8296" stroke-width="1.5" fill="none">
    <circle cx="850" cy="315" r="180" />
    <circle cx="850" cy="315" r="240" stroke-dasharray="6,6" />
    <circle cx="850" cy="315" r="120" />
    <line x1="850" y1="50" x2="850" y2="580" stroke-dasharray="4,4" />
    <line x1="580" y1="315" x2="1120" y2="315" stroke-dasharray="4,4" />
    <polygon points="850,135 1006,225 1006,405 850,495 694,405 694,225" />
  </g>

  <!-- Typography Overlay -->
  <text x="100" y="240" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="16" letter-spacing="0.4em" fill="#3b8296" text-transform="uppercase" font-weight="700">PORTFOLIO FOR SCIENCE &amp; PEDAGOGY</text>
  <text x="100" y="320" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="52" letter-spacing="-0.02em" fill="#ededea" font-weight="700">Ramelito Jr. C. Sanchez</text>
  <text x="100" y="365" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="0.1em" fill="#9ea3ac">LPT · STE Program Faculty · MATATAG</text>
  
  <rect x="100" y="420" width="80" height="3" fill="url(#tealGrad)" />
  <text x="100" y="460" font-family="'Inter', sans-serif" font-size="16" fill="#626772">Department of Education · S.Y. 2019 – 2026</text>
</svg>
